plugins { id "com.android.application" }

android {
    namespace "com.faceid.attendance"
    compileSdk 34

    defaultConfig {
        applicationId "com.faceid.attendance"
        minSdk 24                 // Android 7.0, which is almost every phone in use
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so `assembleRelease` still produces an
            // installable file. A Play Store upload would need a real keystore;
            // for a project handed in on a pen drive this is what you want.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No AndroidX, no third-party libraries. Everything used here is in the
// platform itself, so the build needs nothing but the SDK and never breaks
// because a dependency moved.
dependencies { }
