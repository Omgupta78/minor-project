name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  logic-and-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test-only dependencies
        run: python -m pip install 'numpy<2' openpyxl pillow pillow-heif jinja2
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run offline logic suites
        run: |
          set -e
          for suite in authtest.py selftest.py smalltest.py qualitytest.py multitest.py heictest.py rendertest.py calibrationtest.py doctor.py; do
            echo "=== $suite ==="
            python "$suite"
          done
      - name: Validate CSS generation
        run: python build_css.py
