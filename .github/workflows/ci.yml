name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  logic-and-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install 'Flask==3.0.3' 'Werkzeug==3.0.6' 'numpy==1.26.4' 'opencv-python-headless==4.10.0.84' 'openpyxl==3.1.5' 'Pillow==10.4.0' 'pillow-heif==0.18.0' jinja2 pip-audit
      - name: Compile Python
        run: python -m compileall -q .
      - name: Authentication and isolation tests
        run: python authtest.py
      - name: Data and report tests
        run: python selftest.py
      - name: Recognition edge-case tests
        run: python smalltest.py
      - name: Recognition quality tests
        run: python qualitytest.py
      - name: Multi-photo tests
        run: python multitest.py
      - name: HEIC tests
        run: python heictest.py
      - name: Template rendering tests
        run: python rendertest.py
      - name: Calibration tests
        run: python calibrationtest.py
      - name: Build inventory checks
        run: python doctor.py
      - name: Security middleware tests
        run: python securitytest.py
      - name: Check generated CSS is committed
        run: |
          python build_css.py
          git diff --exit-code -- static/app.css
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Validate Dockerfile
        run: docker build --check .
