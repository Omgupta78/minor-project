# Render blueprint - FREE tier (ephemeral storage, data resets on redeploy).
# For persistent data upgrade to starter plan and re-add the disk: block.
services:
  - type: web
    name: faceid-attendance
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # Open so you can register the first account after deploy.
      # Set to "0" in the Render dashboard once your account is created.
      - key: ALLOW_SIGNUP
        value: "1"
      - key: PRODUCTION
        value: "1"
      # Render terminates TLS and serves *.onrender.com over HTTPS on every
      # plan, so the login cookie can and should carry the Secure flag. Only
      # set this to "0" if you are reaching the app over plain http.
      - key: COOKIE_SECURE
        value: "1"
      - key: SESSION_HOURS
        value: "12"
      - key: LOGIN_RATE_LIMIT
        value: "5"
      - key: LOGIN_RATE_WINDOW
        value: "900"
      # Ephemeral paths — data is lost on redeploy (free tier limitation).
      - key: ATTENDANCE_DB
        value: /tmp/attendance.db
      - key: FACES_DIR
        value: /tmp/faces
      - key: PORT
        value: "8000"
      - key: HOST
        value: 0.0.0.0
      - key: OPEN_BROWSER
        value: "0"
      - key: FLASK_DEBUG
        value: "0"
      - key: GUNICORN_TIMEOUT
        value: "300"
      # SQLite and CPU-heavy face scans are safer with one process. It also
      # leaves the cores free for the scan's own worker processes.
      - key: WEB_CONCURRENCY
        value: "1"
      # The free tier is 0.1 CPU / 512 MB: enough to demonstrate the app, not
      # enough for a 120-student hall photo. One worker keeps it inside the
      # memory limit; see RECOGNITION.md for what a real class needs.
      - key: SCAN_WORKERS
        value: "1"
