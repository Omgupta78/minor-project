# Render blueprint. A paid plan is required because attendance and faces need a persistent disk.
services:
  - type: web
    name: faceid-attendance
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: false
    disk:
      name: attendance-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # Closed by default. The first account can still bootstrap a new database.
      - key: ALLOW_SIGNUP
        value: "0"
      - key: PRODUCTION
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: SESSION_HOURS
        value: "12"
      - key: LOGIN_RATE_LIMIT
        value: "5"
      - key: LOGIN_RATE_WINDOW
        value: "900"
      - key: ATTENDANCE_DB
        value: /data/attendance.db
      - key: FACES_DIR
        value: /data/faces
      - key: PORT
        value: "8000"
      - key: HOST
        value: 0.0.0.0
      - key: OPEN_BROWSER
        value: "0"
      - key: FLASK_DEBUG
        value: "0"
      - key: GUNICORN_TIMEOUT
        value: "300"
      # SQLite and CPU-heavy face scans are safer with one process.
      - key: WEB_CONCURRENCY
        value: "1"
